<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Aurelle Detailing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                        url('https://images.unsplash.com/...') center/cover no-repeat;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.22);
            padding: 42px 36px;
            backdrop-filter: blur(6px);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: clamp(2rem, 3vw, 2.6rem);
            color: #1a1a1a;
            margin-bottom: 10px;
            letter-spacing: 0.04em;
        }

        .header p {
            color: #555;
            font-size: 1rem;
        }

        form {
            display: grid;
            gap: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.92rem;
            font-weight: 600;
            color: #2a2a2a;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            background: #fff;
            border: 1px solid #d9d9d9;
            border-radius: 10px;
            padding: 13px 14px;
            font-size: 1rem;
            color: #222;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #b28b39;
            box-shadow: 0 0 0 3px rgba(178, 139, 57, 0.12);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 14px 22px;
            background: linear-gradient(135deg, #b28b39, #d3a95b);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 25px rgba(178, 139, 57, 0.28);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(178, 139, 57, 0.32);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .contact-info {
            margin-top: 26px;
            padding-top: 24px;
            border-top: 1px solid #e5e5e5;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            text-align: center;
        }

        .info-item {
            color: #444;
            font-size: 0.96rem;
        }

        .info-item a {
            color: #8a6b2c;
            text-decoration: none;
            font-weight: 600;
        }

        .info-item a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        @media (max-width: 640px) {
            .container {
                padding: 28px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Contact Aurelle Detailing</h1>
            <p>Tell us about your vehicle and we'll help you get the perfect detail.</p>
        </div>

        <div id="message" class="message"></div>

        <form id="contactForm" method="POST">
            <div class="form-row">
                <div class="field">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="form-row">
                <div class="field">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890">
                </div>

                <div class="field">
                    <label for="service">Service</label>
                    <input type="text" id="service" name="service" placeholder="Exterior detail, interior detail...">
                </div>
            </div>

            <div class="field">
                <label for="message">Message</label>
                <textarea id="message-text" name="message" placeholder="Tell us about your vehicle and what you need..." required></textarea>
            </div>

            <button type="submit">Send Inquiry</button>
        </form>

        <div class="contact-info">
            <div class="info-item">📞 <a href="tel:+1 657-543-4443">(657) 543-4443</a></div>
            <div class="info-item">✉️ <a href="mailto:hello@aurelledetailing.com">hello@aurelledetailing.com</a></div>
            <div class="info-item">📍 Santa Ana, California</div>
        </div>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            const button = form.querySelector('button');
            button.disabled = true;

            try {
                // Send to Formspree (handles email delivery)
                const response = await fetch('https://formspree.io/f/xyzpqrst', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    messageDiv.textContent = '✓ Thank you! Your inquiry has been sent. We\'ll contact you soon.';
                    messageDiv.classList.remove('error');
                    messageDiv.classList.add('success');
                    form.reset();
                } else {
                    throw new Error('Form submission failed');
                }
            } catch (error) {
                messageDiv.textContent = '✗ Error sending message. Please try again or call us directly.';
                messageDiv.classList.remove('success');
                messageDiv.classList.add('error');
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
