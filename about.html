<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About | Aurelle Detailing</title>
  <style>
    :root {
      --bg: #f5f1ea;
      --panel: #ffffff;
      --ink: #1d1d1d;
      --muted: #5e5e5e;
      --accent: #c89b3c;
      --line: #e8e1d8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f8f4ef 0%, #f1ece5 100%);
      color: var(--ink);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .story {
      max-width: 850px;
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.04);
      padding: 40px 32px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--ink);
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 1.08rem;
    }

    p:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main class="story">
    <h1>About Aurelle Detailing</h1>
    <p>We started as a group of kids with a shared love for cars and a dream of building something meaningful together.</p>
    <p>What began as passion, hard work, and a lot of learning grew into a business built on care, craftsmanship, and pride in every vehicle we touch.</p>
  </main>
</body>
</html>
