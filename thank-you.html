<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Aurelle Detailing</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                        url('gold-car.jpeg') center/cover no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .thank-you-card {
            max-width: 620px;
            width: 100%;
            background: rgba(20, 20, 20, 0.72);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(0,0,0,0.25);
            padding: 48px 32px;
            text-align: center;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            margin-bottom: 16px;
            color: #f0d39a;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #f5f5f5;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #f0d39a;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="thank-you-card">
        <h1>Thank You!</h1>
        <p>Your message has been received successfully. We will get back to you soon.</p>
        <p>For urgent inquiries, please call us at <strong>(657) 543-4443</strong>.</p>
        <a href="index.html">Return to Home</a>
    </div>
</body>
</html>
